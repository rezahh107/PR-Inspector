name: Diagnose PR37 repository validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Run repository validator on exact Head
        shell: bash
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${EXPECTED_SHA}"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          python -m pip install -q --disable-pip-version-check ".[dev]"
          python scripts/validate_repository_v2.py
