name: Parent payload compact diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXACT_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Run payload compactly
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          python - "$work" <<'PY'
          import io, os, sys, urllib.request, zipfile
          work = sys.argv[1]
          url = f"https://codeload.github.com/rezahh107/PR-Inspector/zip/{os.environ['EXACT_SHA']}"
          with urllib.request.urlopen(url, timeout=30) as response:
              data = response.read()
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              archive.extractall(work)
          PY
          repo="$(find "$work" -mindepth 1 -maxdepth 1 -type d | head -n1)"
          set +e
          output="$(cd "$repo" && python .repair/governance-repair-payload.py 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          exit "$status"
