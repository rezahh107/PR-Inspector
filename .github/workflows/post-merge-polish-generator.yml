name: Generate post-merge governance hardening

on:
  push:
    branches: [agent/post-merge-governance-v1-9]
    paths:
      - scripts/generate_post_merge_polish.py
      - .github/workflows/post-merge-polish-generator.yml

permissions:
  contents: write

concurrency:
  group: post-merge-polish-generator
  cancel-in-progress: false

jobs:
  generate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out generator branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/post-merge-governance-v1-9
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip

      - name: Generate v1.9.0 maintenance snapshot
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.3
          python scripts/generate_post_merge_polish.py

      - name: Validate generated repository
        run: |
          python -m pip install --disable-pip-version-check ".[dev]"
          python scripts/validate_repository_v2.py
          python -m pytest -q tests/test_behavioral_rule_coverage.py
          python -m pytest -q tests/test_governance_enforcement.py
          python -m pytest

      - name: Commit generated hardening
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test -n "$(git status --short)"
          git commit -m "feat: add v1.9 governance enforcement"
          git push origin HEAD:agent/post-merge-governance-v1-9
