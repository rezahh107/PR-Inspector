name: Export exact PR18 checkout

on:
  pull_request:
  push:
    branches:
      - governance/personal-minimum-security-profile

permissions:
  contents: read

concurrency:
  group: export-pr18-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  export:
    if: github.repository == 'rezahh107/PR-Inspector'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact triggering head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact checkout identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Archive repository checkout
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude='./.git' \
            --exclude='./.github/workflows/export-pr18-checkout.yml' \
            -czf /tmp/pr18-checkout.tgz .

      - name: Upload exact checkout
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr18-exact-checkout-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/pr18-checkout.tgz
          if-no-files-found: error
          retention-days: 1
