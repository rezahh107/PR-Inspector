name: Apply PR35 authority completeness repair

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-validate-clean:
    if: github.event.pull_request.number == 35 && github.event.pull_request.head.ref == 'feat/v1-12-verified-review-package'
    runs-on: ubuntu-latest
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Check out exact PR Head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact triggering Head
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'

      - name: Reconstruct and apply bounded repair
        run: |
          test "$(find .github/pr35-authority-repair -maxdepth 1 -type f -name 'chunk-*' | wc -l)" -eq 9
          cat .github/pr35-authority-repair/chunk-* > /tmp/pr35-authority-repair.patch.gz
          echo "d5396be2f63fdca5ae90a1e305360d1e41e9e4dc9b1fc3ad71338df638a531b0  /tmp/pr35-authority-repair.patch.gz" | sha256sum -c -
          gzip -dc /tmp/pr35-authority-repair.patch.gz > /tmp/pr35-authority-repair.patch
          git apply --check /tmp/pr35-authority-repair.patch
          git apply /tmp/pr35-authority-repair.patch
          rm -rf \
            .github/pr35-authority-repair \
            .github/workflows/apply-pr35-authority-repair.yml
          test ! -e .github/workflows/export-pr21-rerepair.yml
          test ! -e sitecustomize.py
          test ! -e usercustomize.py

      - name: Create local final commit
        run: |
          test -n "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close authority and evidence completeness gaps"
          test -z "$(git status --porcelain)"

      - name: Install project dependencies
        run: python -m pip install ".[dev]"

      - name: Validate versioned repository
        shell: bash
        run: |
          set +e
          python scripts/validate_repository_v2.py >/tmp/repository-validator.log 2>&1
          status=$?
          tail -80 /tmp/repository-validator.log
          exit "$status"

      - name: Upload repository-validator diagnostic
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr35-repository-validator-${{ github.run_id }}
          path: /tmp/repository-validator.log
          if-no-files-found: error
          retention-days: 1

      - name: Validate static planning state
        run: python scripts/validate_planning_governance.py --check-static

      - name: Validate focused authority suite
        run: python -m pytest -q tests/test_v1_12_verified_review_authority.py

      - name: Validate evidence completeness suite
        run: python -m pytest -q tests/test_v1_12_evidence_completeness.py

      - name: Validate planning governance tests
        run: python -m pytest -q tests/test_planning_governance.py

      - name: Validate behavioral coverage tests
        run: python -m pytest -q tests/test_behavioral_rule_coverage.py

      - name: Validate repository closure tests
        run: python -m pytest -q tests/test_repository_closure.py

      - name: Validate complete repository suite
        run: python -m pytest -q

      - name: Validate compilation and diff hygiene
        run: |
          python -m compileall -q pr_inspector scripts
          git diff --check HEAD^
          test -z "$(git status --porcelain)"

      - name: Push validated final state
        run: git push origin "HEAD:${HEAD_BRANCH}"
