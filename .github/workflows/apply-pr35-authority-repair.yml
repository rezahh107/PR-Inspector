name: Apply PR35 authority completeness repair

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-validate-push:
    if: github.event.pull_request.number == 35 && github.event.pull_request.head.ref == 'feat/v1-12-verified-review-package'
    runs-on: ubuntu-latest
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Check out exact PR Head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact triggering Head
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"

      - name: Detect repair payload
        id: payload
        shell: bash
        run: |
          if [[ -f .github/pr35-authority-repair/chunk-00 ]]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up Python
        if: steps.payload.outputs.present == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'

      - name: Reconstruct bounded repair
        if: steps.payload.outputs.present == 'true'
        run: |
          test "$(find .github/pr35-authority-repair -maxdepth 1 -type f -name 'chunk-*' | wc -l)" -eq 9
          cat .github/pr35-authority-repair/chunk-* > /tmp/pr35-authority-repair.patch.gz
          echo "d5396be2f63fdca5ae90a1e305360d1e41e9e4dc9b1fc3ad71338df638a531b0  /tmp/pr35-authority-repair.patch.gz" | sha256sum -c -
          gzip -dc /tmp/pr35-authority-repair.patch.gz > /tmp/pr35-authority-repair.patch
          git apply --check --exclude=.github/workflows/validate-repository.yml /tmp/pr35-authority-repair.patch
          git apply --exclude=.github/workflows/validate-repository.yml /tmp/pr35-authority-repair.patch

          test "$(find .github/pr35-authority-repair -maxdepth 1 -type f -name 'test-chunk-*' | wc -l)" -eq 2
          cat .github/pr35-authority-repair/test-chunk-* > /tmp/pr35-evidence-test.patch.gz
          echo "8e0cb8d4ea894ade4635cc1b05daef3228e76fb01e277e1abf859517b67b4077  /tmp/pr35-evidence-test.patch.gz" | sha256sum -c -
          gzip -dc /tmp/pr35-evidence-test.patch.gz > /tmp/pr35-evidence-test.patch
          git apply --check /tmp/pr35-evidence-test.patch
          git apply /tmp/pr35-evidence-test.patch

          rm -rf .github/pr35-authority-repair
          test -e .github/workflows/apply-pr35-authority-repair.yml
          test ! -e .github/workflows/export-pr21-rerepair.yml
          test ! -e sitecustomize.py
          test ! -e usercustomize.py

      - name: Create pushable production commit
        if: steps.payload.outputs.present == 'true'
        id: push_commit
        run: |
          test -n "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close authority and evidence completeness gaps"
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "${GITHUB_OUTPUT}"
          test -z "$(git status --porcelain)"

      - name: Create validation-only cleanup commit
        if: steps.payload.outputs.present == 'true'
        id: validated
        run: |
          git rm .github/workflows/apply-pr35-authority-repair.yml
          git commit -m "chore: validate final cleanup tree"
          git rev-parse HEAD > /tmp/pr35-validated-head.txt
          git rev-parse 'HEAD^{tree}' > /tmp/pr35-validated-tree.txt
          echo "head=$(cat /tmp/pr35-validated-head.txt)" >> "${GITHUB_OUTPUT}"
          echo "tree=$(cat /tmp/pr35-validated-tree.txt)" >> "${GITHUB_OUTPUT}"
          test -z "$(git status --porcelain)"

      - name: Install project dependencies
        if: steps.payload.outputs.present == 'true'
        run: python -m pip install ".[dev]"

      - name: Validate versioned repository
        if: steps.payload.outputs.present == 'true'
        run: python scripts/validate_repository_v2.py

      - name: Validate static planning state
        if: steps.payload.outputs.present == 'true'
        run: python scripts/validate_planning_governance.py --check-static

      - name: Validate focused authority suite
        if: steps.payload.outputs.present == 'true'
        run: python -m pytest -q tests/test_v1_12_verified_review_authority.py

      - name: Validate evidence completeness suite
        if: steps.payload.outputs.present == 'true'
        run: python -m pytest -q tests/test_v1_12_evidence_completeness.py

      - name: Validate planning governance tests
        if: steps.payload.outputs.present == 'true'
        run: python -m pytest -q tests/test_planning_governance.py

      - name: Validate behavioral coverage tests
        if: steps.payload.outputs.present == 'true'
        run: python -m pytest -q tests/test_behavioral_rule_coverage.py

      - name: Validate repository closure tests
        if: steps.payload.outputs.present == 'true'
        run: python -m pytest -q tests/test_repository_closure.py

      - name: Validate complete repository suite
        if: steps.payload.outputs.present == 'true'
        run: python -m pytest -q

      - name: Validate compilation and diff hygiene
        if: steps.payload.outputs.present == 'true'
        run: |
          python -m compileall -q pr_inspector scripts
          git diff --check HEAD^
          test -z "$(git status --porcelain)"

      - name: Upload validated tree identity
        if: steps.payload.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr35-validated-tree-${{ github.run_id }}
          path: |
            /tmp/pr35-validated-head.txt
            /tmp/pr35-validated-tree.txt
          if-no-files-found: error
          retention-days: 1

      - name: Restore pushable production commit
        if: steps.payload.outputs.present == 'true'
        run: |
          git reset --hard "${{ steps.push_commit.outputs.sha }}"
          test -e .github/workflows/apply-pr35-authority-repair.yml
          test ! -e .github/pr35-authority-repair
          test -z "$(git status --porcelain)"

      - name: Push validated production state
        if: steps.payload.outputs.present == 'true'
        run: git push origin "HEAD:refs/heads/${HEAD_BRANCH}"
