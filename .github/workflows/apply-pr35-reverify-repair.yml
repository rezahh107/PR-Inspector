name: Apply PR35 re-verification authority repair

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-validate-push:
    if: github.event.pull_request.number == 35 && github.event.pull_request.head.ref == 'feat/v1-12-verified-review-package'
    runs-on: ubuntu-latest
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Check out exact PR Head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact triggering Head
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"

      - name: Reconstruct bounded repair
        run: |
          test -f .github/pr35-reverify-repair/chunk-00
          cat .github/pr35-reverify-repair/chunk-* > /tmp/pr35-reverify.patch.gz
          echo "2d48ad474fca9522e66f7b5223bbbbcb83bf182a8a508910fa9fc002048f508e  /tmp/pr35-reverify.patch.gz" | sha256sum -c -
          gzip -dc /tmp/pr35-reverify.patch.gz > /tmp/pr35-reverify.patch
          git apply --check /tmp/pr35-reverify.patch
          git apply /tmp/pr35-reverify.patch
          rm -rf .github/pr35-reverify-repair
          test -e .github/workflows/apply-pr35-reverify-repair.yml
          test ! -e .github/workflows/export-pr21-rerepair.yml
          test ! -e sitecustomize.py
          test ! -e usercustomize.py

      - name: Create pushable production commit
        id: push_commit
        run: |
          test -n "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: bind re-verification to genuine completion"
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          test -z "$(git status --porcelain)"

      - name: Create validation-only cleanup commit
        id: validated
        run: |
          git rm .github/workflows/apply-pr35-reverify-repair.yml
          git commit -m "chore: validate final cleanup tree"
          git rev-parse HEAD > /tmp/pr35-validated-head.txt
          git rev-parse 'HEAD^{tree}' > /tmp/pr35-validated-tree.txt
          echo "head=$(cat /tmp/pr35-validated-head.txt)" >> "${GITHUB_OUTPUT}"
          echo "tree=$(cat /tmp/pr35-validated-tree.txt)" >> "${GITHUB_OUTPUT}"
          test -z "$(git status --porcelain)"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'

      - name: Install project dependencies
        run: python -m pip install ".[dev]"

      - name: Validate versioned repository
        run: python scripts/validate_repository_v2.py

      - name: Validate static planning state
        run: python scripts/validate_planning_governance.py --check-static

      - name: Validate authority and completion regressions
        run: python -m pytest -q tests/test_v1_12_verified_review_authority.py

      - name: Validate evidence completeness
        run: python -m pytest -q tests/test_v1_12_evidence_completeness.py

      - name: Validate repository closure
        run: python -m pytest -q tests/test_repository_closure.py

      - name: Validate canonical output enforcement
        run: python -m pytest -q tests/test_canonical_output_enforcement.py

      - name: Validate canonical output atomicity
        run: python -m pytest -q tests/test_canonical_output_atomicity.py

      - name: Validate owner delivery
        run: python -m pytest -q tests/test_atomic_owner_delivery.py tests/test_render_cli_owner_delivery.py

      - name: Validate complete repository suite
        run: python -m pytest -q

      - name: Validate compilation and diff hygiene
        run: |
          python -m compileall -q pr_inspector scripts
          git diff --check "${EXPECTED_HEAD}"
          test -z "$(git status --porcelain)"

      - name: Upload validated tree identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr35-reverify-validated-tree-${{ github.run_id }}
          path: |
            /tmp/pr35-validated-head.txt
            /tmp/pr35-validated-tree.txt
          if-no-files-found: error
          retention-days: 1

      - name: Restore pushable production commit
        run: |
          git reset --hard "${{ steps.push_commit.outputs.sha }}"
          test -e .github/workflows/apply-pr35-reverify-repair.yml
          test ! -e .github/pr35-reverify-repair
          test -z "$(git status --porcelain)"

      - name: Push validated production state
        run: git push origin "HEAD:refs/heads/${HEAD_BRANCH}"
