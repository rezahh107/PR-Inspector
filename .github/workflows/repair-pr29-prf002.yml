name: Repair PR29 PRF-002 provenance

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: repair-pr29-prf002
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.number == 29 && github.event.pull_request.head.ref == 'fix/v1-11-1-output-authority-consolidation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact triggering head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 2

      - name: Verify bounded starting state
        env:
          EXPECTED_PARENT_HEAD: b38a6f37b899114adf5601f0782067fca14d58aa
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT_HEAD}"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/repair-pr29-prf002.yml"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check ".[dev]"

      - name: Apply transparent bounded patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one replacement, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8", newline="")

          replace_once(
              "scripts/validate_rereview_sequence.py",
              '''def _github_json(url: str, token: str | None, api_version: str) -> dict:
              headers = {
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": api_version,
                  "User-Agent": "PR-Inspector-rereview-verifier",
              }
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              request = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = json.loads(response.read().decode("utf-8"))
              except (urllib.error.URLError, TimeoutError, UnicodeDecodeError, json.JSONDecodeError) as exc:
                  raise ProvenanceError(f"GitHub evidence request failed: {exc}") from exc
              if not isinstance(payload, dict):
                  raise ProvenanceError("GitHub evidence response must be a JSON object")
              return payload
          ''',
              '''def _github_json(url: str, token: str | None, api_version: str):
              return fetch_github_api_response(
                  url,
                  token=token,
                  api_version=api_version,
              )
          ''',
          )

          replace_once(
              "tests/test_candidate_v1_11.py",
              "import pr_inspector.candidate_v1_11 as candidate\nfrom pr_inspector._governance_transport import _mint_response\n",
              "import pr_inspector.candidate_v1_11 as candidate\nfrom pr_inspector import _governance_transport\nfrom pr_inspector._governance_transport import (\n    GitHubApiResponse,\n    _mint_response,\n    fetch_github_api_response,\n)\n",
          )
          replace_once(
              "tests/test_candidate_v1_11.py",
              "from pr_inspector.review_provenance import verify_github_commit_payload\n",
              "from pr_inspector.review_provenance import (\n    ProvenanceError,\n    VerifiedInspectorCommit,\n    is_verified_inspector_commit,\n    verify_github_commit_payload,\n)\n",
          )
          replace_once(
              "tests/test_candidate_v1_11.py",
              'SHA = "a" * 40\n\n',
              '''SHA = "a" * 40


class _FakeHttpResponse:
    def __init__(self, url: str, payload: object, status: int = 200):
        self._url = url
        self._payload = payload
        self.status = status

    def geturl(self) -> str:
        return self._url

    def read(self) -> bytes:
        return json.dumps(self._payload).encode("utf-8")

    def close(self) -> None:
        pass


def _inspector_payloads(commit_sha: str = INSPECTOR_COMMIT):
    repository_url = f"https://api.github.com/repos/{INSPECTOR_REPOSITORY}"
    commit_url = f"{repository_url}/commits/{commit_sha}"
    return (
        {
            "id": INSPECTOR_REPOSITORY_ID,
            "full_name": INSPECTOR_REPOSITORY,
            "url": repository_url,
            "html_url": f"https://github.com/{INSPECTOR_REPOSITORY}",
        },
        {
            "sha": commit_sha,
            "url": commit_url,
            "html_url": (
                f"https://github.com/{INSPECTOR_REPOSITORY}/commit/{commit_sha}"
            ),
        },
    )


def _fetch_inspector_responses(
    *,
    repository_payload=None,
    commit_payload=None,
    repository_status: int = 200,
    commit_status: int = 200,
):
    default_repository, default_commit = _inspector_payloads()
    repository_payload = repository_payload or default_repository
    commit_payload = commit_payload or default_commit
    repository_url = f"https://api.github.com/repos/{INSPECTOR_REPOSITORY}"
    commit_url = f"{repository_url}/commits/{INSPECTOR_COMMIT}"
    responses = {
        repository_url: _FakeHttpResponse(
            repository_url,
            repository_payload,
            repository_status,
        ),
        commit_url: _FakeHttpResponse(commit_url, commit_payload, commit_status),
    }

    def fake_urlopen(request, timeout):
        return responses[request.full_url]

    with pytest.MonkeyPatch.context() as patch:
        patch.setattr(
            _governance_transport.urllib.request,
            "urlopen",
            fake_urlopen,
        )
        repository_response = fetch_github_api_response(
            repository_url,
            token=None,
            api_version=API_VERSION,
        )
        commit_response = fetch_github_api_response(
            commit_url,
            token=None,
            api_version=API_VERSION,
        )
    return repository_response, commit_response


def _copy_response(response: GitHubApiResponse) -> GitHubApiResponse:
    copied = object.__new__(GitHubApiResponse)
    for name in GitHubApiResponse.__slots__:
        if name == "__weakref__":
            continue
        object.__setattr__(copied, name, getattr(response, name))
    return copied

