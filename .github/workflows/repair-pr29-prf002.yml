name: Repair PR29 PRF-002 provenance

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: repair-pr29-prf002
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.number == 29 && github.event.pull_request.head.ref == 'fix/v1-11-1-output-authority-consolidation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact triggering head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 3

      - name: Verify exact staged patch source
        env:
          EXPECTED_PARENT_HEAD: 3331f70fe26e8bf0e3fb4c25f1c4b47e3fe5fd34
          STAGED_PATCH_COMMIT: 70c4c065d5ec458de76bb86ea7350a44457f077c
          EXPECTED_PATCH_BLOB: d92bc393e53771c96d0c117ad354f3a6ffaf9b57
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT_HEAD}"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/repair-pr29-prf002.yml"
          test "$(git rev-parse ${STAGED_PATCH_COMMIT}:.github/workflows/repair-pr29-prf002.yml)" = "${EXPECTED_PATCH_BLOB}"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check ".[dev]"

      - name: Apply exact transparent patch from verified commit
        env:
          STAGED_PATCH_COMMIT: 70c4c065d5ec458de76bb86ea7350a44457f077c
        run: |
          set -euo pipefail
          git show ${STAGED_PATCH_COMMIT}:.github/workflows/repair-pr29-prf002.yml > /tmp/staged-patch.yml
          awk '/^          python - <<'"'"'PY'"'"'$/{capture=1; next} capture && /^          PY$/{exit} capture{sub(/^          /, ""); print}' /tmp/staged-patch.yml > /tmp/apply_prf002.py
          test -s /tmp/apply_prf002.py
          python /tmp/apply_prf002.py
          git rm .github/workflows/repair-pr29-prf002.yml
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'.github/workflows/repair-pr29-prf002.yml\nCHANGELOG.md\nscripts/validate_rereview_sequence.py\ntests/test_behavioral_rule_coverage.py\ntests/test_candidate_v1_11.py'
          test "${changed}" = "${expected}"

      - name: Validate repaired final tree
        run: |
          set -euo pipefail
          python scripts/validate_repository_v2.py
          python -m pytest -q tests/test_candidate_v1_11.py
          python -m pytest -q tests/test_repository_closure.py
          python -m pytest -q tests/test_v1_11_1_output_authority.py
          python -m pytest -q tests/test_behavioral_rule_coverage.py
          python -m pytest -q tests/test_governance_enforcement.py
          python -m pytest

      - name: Commit validated repair
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete PRF-002 Inspector provenance repair"
          git push origin "HEAD:${BRANCH}"
