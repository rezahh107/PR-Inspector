name: Diagnose PR29 PRF-002 syntax

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: repair-pr29-prf002
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event.pull_request.number == 29 && github.event.pull_request.head.ref == 'fix/v1-11-1-output-authority-consolidation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact triggering head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 13

      - name: Verify exact staged patch source
        env:
          EXPECTED_PARENT_HEAD: 18bf6a21cd07409bf9b1e4ff946aa50a9dcd73b6
          STAGED_PATCH_COMMIT: 70c4c065d5ec458de76bb86ea7350a44457f077c
          EXPECTED_PATCH_BLOB: d92bc393e53771c96d0c117ad354f3a6ffaf9b57
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT_HEAD}"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/repair-pr29-prf002.yml"
          test "$(git rev-parse ${STAGED_PATCH_COMMIT}:.github/workflows/repair-pr29-prf002.yml)" = "${EXPECTED_PATCH_BLOB}"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Capture syntax failure
        env:
          STAGED_PATCH_COMMIT: 70c4c065d5ec458de76bb86ea7350a44457f077c
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git show ${STAGED_PATCH_COMMIT}:.github/workflows/repair-pr29-prf002.yml > /tmp/staged-patch.yml
          awk '/^          python - <<'"'"'PY'"'"'$/{capture=1; next} capture && /^          PY$/{exit} capture{sub(/^          /, ""); print}' /tmp/staged-patch.yml > /tmp/apply_prf002.py
          sed -i 's/if count != 1:/if count < 1:/' /tmp/apply_prf002.py
          python /tmp/apply_prf002.py
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_candidate_v1_11.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("def _copy_response(")
          end = text.index("def _replace_exact(", start)
          corrected = """def _copy_response(response: GitHubApiResponse) -> GitHubApiResponse:\n    copied = object.__new__(GitHubApiResponse)\n    for name in GitHubApiResponse.__slots__:\n        if name == \"__weakref__\":\n            continue\n        object.__setattr__(copied, name, getattr(response, name))\n    return copied\n\n\n"""
          path.write_text(text[:start] + corrected + text[end:], encoding="utf-8", newline="")
          PY
          set +e
          python -m py_compile scripts/validate_rereview_sequence.py tests/test_candidate_v1_11.py tests/test_behavioral_rule_coverage.py > /tmp/syntax.out 2>&1
          status=$?
          set -e
          git reset --hard HEAD
          {
            echo "exit_status=${status}"
            cat /tmp/syntax.out
          } > .prf002-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .prf002-error.txt
          git commit -m "Record PRF-002 syntax diagnostic"
          git push origin "HEAD:${BRANCH}"
