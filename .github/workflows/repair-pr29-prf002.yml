name: Diagnose PR29 PRF-002 patch

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: repair-pr29-prf002
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event.pull_request.number == 29 && github.event.pull_request.head.ref == 'fix/v1-11-1-output-authority-consolidation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact triggering head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 5

      - name: Verify exact staged patch source
        env:
          EXPECTED_PARENT_HEAD: a672627141196b77508dc239d690259ae628caaa
          STAGED_PATCH_COMMIT: 70c4c065d5ec458de76bb86ea7350a44457f077c
          EXPECTED_PATCH_BLOB: d92bc393e53771c96d0c117ad354f3a6ffaf9b57
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT_HEAD}"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/repair-pr29-prf002.yml"
          test "$(git rev-parse ${STAGED_PATCH_COMMIT}:.github/workflows/repair-pr29-prf002.yml)" = "${EXPECTED_PATCH_BLOB}"

      - name: Capture exact patch failure
        env:
          STAGED_PATCH_COMMIT: 70c4c065d5ec458de76bb86ea7350a44457f077c
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git show ${STAGED_PATCH_COMMIT}:.github/workflows/repair-pr29-prf002.yml > /tmp/staged-patch.yml
          awk '/^          python - <<'"'"'PY'"'"'$/{capture=1; next} capture && /^          PY$/{exit} capture{sub(/^          /, ""); print}' /tmp/staged-patch.yml > /tmp/apply_prf002.py
          sed -i 's/if count != 1:/if count < 1:/' /tmp/apply_prf002.py
          set +e
          python /tmp/apply_prf002.py > /tmp/prf002.out 2>&1
          status=$?
          set -e
          {
            echo "exit_status=${status}"
            cat /tmp/prf002.out
          } > .prf002-error.txt
          git reset --hard HEAD
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .prf002-error.txt
          git commit -m "Record temporary PRF-002 patch diagnostic"
          git push origin "HEAD:${BRANCH}"
