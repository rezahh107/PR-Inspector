name: Repair PR29 Minimal reference capability

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: repair-pr29-minimal-reference
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.number == 29 && github.event.pull_request.head.ref == 'fix/v1-11-1-output-authority-consolidation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact triggering head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 2

      - name: Verify bounded starting state
        env:
          EXPECTED_PARENT_HEAD: b5b1103caa4fa8065672f7b50cb275ccd6f24c2c
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT_HEAD}"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/repair-pr29-minimal-reference.yml"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check ".[dev]"

