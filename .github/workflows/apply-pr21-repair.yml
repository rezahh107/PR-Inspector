name: Apply bounded PR21 repair

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'rezahh107/PR-Inspector'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact triggering head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Verify bounded staging identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          git merge-base --is-ancestor adc6badcbfcb7ab68ccd1b40219447ff3707342b HEAD
          git diff --name-only adc6badcbfcb7ab68ccd1b40219447ff3707342b..HEAD | sort > /tmp/observed-paths.txt
          cat > /tmp/expected-paths.txt <<'EOF'
          .github/workflows/apply-pr21-repair.yml
          .pr-inspector-repair/pr21-payload-00.b64
          .pr-inspector-repair/pr21-payload-01.b64
          .pr-inspector-repair/pr21-payload-02.b64
          .pr-inspector-repair/pr21-payload-03.b64
          EOF
          diff -u /tmp/expected-paths.txt /tmp/observed-paths.txt

      - name: Materialize and apply bounded repair
        shell: bash
        run: |
          set -euo pipefail
          test ! -e protocols/v1.10.2
          cp -a protocols/v1.10.1 protocols/v1.10.2
          python - <<'PY'
          from pathlib import Path

          for path in Path("protocols/v1.10.2").rglob("*"):
              if not path.is_file():
                  continue
              text = path.read_text(encoding="utf-8")
              path.write_text(
                  text.replace("v1.10.1", "v1.10.2").replace("1.10.1", "1.10.2"),
                  encoding="utf-8",
                  newline="\n",
              )
          PY
          git add protocols/v1.10.2
          cat .pr-inspector-repair/pr21-payload-0{0,1,2,3}.b64 \
            | base64 -d > /tmp/pr21-repair.patch.bz2
          echo 'b1ba59b95d8dd7edd12dea7abe292fd95cb6d3c3c84341d277eb28b5d1f9ad35  /tmp/pr21-repair.patch.bz2' \
            | sha256sum -c -
          bzip2 -dc /tmp/pr21-repair.patch.bz2 > /tmp/pr21-repair.patch
          echo '634053cc1c53234a68bc6425588f15da2b1e02b5370d2a9680f94d81643e8ced  /tmp/pr21-repair.patch' \
            | sha256sum -c -
          git apply --index --whitespace=error-all /tmp/pr21-repair.patch
          git rm .github/workflows/apply-pr21-repair.yml
          git rm -r .pr-inspector-repair
          test ! -e .github/workflows/export-pr-workspace.yml
          test ! -e .github/workflows/apply-pr21-repair.yml
          test ! -e .pr-inspector-repair
          git diff --cached --check

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pinned project and test dependencies
        run: python -m pip install --disable-pip-version-check ".[dev]"

      - name: Run required validation before publication
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_repository_v2.py
          python -m pytest -q tests/test_behavioral_rule_coverage.py
          python -m pytest -q tests/test_canonical_output_enforcement.py
          python -m pytest -q tests/test_atomic_owner_delivery.py
          python -m pytest -q tests/test_render_cli_owner_delivery.py
          python -m pytest

      - name: Commit and push repaired PR head
        shell: bash
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Release v1.10.2 atomic owner delivery'
          git push origin "HEAD:${BRANCH}"
