name: Apply PRF-002-R1 bounded repair

on:
  push:
    branches: [fix/v1-11-1-output-authority-consolidation]

permissions:
  contents: write

concurrency:
  group: prf-002-r1-repair
  cancel-in-progress: false

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact triggering branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/v1-11-1-output-authority-consolidation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned project and test dependencies
        run: python -m pip install --disable-pip-version-check ".[dev]"

      - name: Apply bounded repair and remove temporary machinery
        run: |
          set -euo pipefail
          python scripts/_apply_prf_002_r1.py
          rm scripts/_apply_prf_002_r1.py
          rm .github/workflows/prf-002-r1-repair.yml

      - name: Run required validation
        run: |
          set -euo pipefail
          python scripts/validate_repository_v2.py
          python -m pytest -q tests/test_candidate_v1_11.py
          python -m pytest -q tests/test_behavioral_rule_coverage.py
          python -m pytest -q tests/test_repository_closure.py
          python -m pytest -q tests/test_v1_11_1_output_authority.py
          python -m pytest -q tests/test_governance_enforcement.py
          python -m pytest

      - name: Commit validated repair to the PR branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: close PRF-002-R1 response provenance bypass"
          git push origin HEAD:fix/v1-11-1-output-authority-consolidation
