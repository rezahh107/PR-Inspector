name: Validate PR Inspector repository

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact triggering head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact checkout identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "expected_sha=${EXPECTED_SHA}"
          echo "actual_sha=${actual_sha}"
          test "${actual_sha}" = "${EXPECTED_SHA}"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install pinned project and test dependencies
        run: python -m pip install --disable-pip-version-check ".[dev]"

      - name: Record and validate tested object identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            tested_ref_type="pull_request_head"
            claim_exact_head="true"
          else
            tested_ref_type="push_or_dispatch"
            claim_exact_head="false"
          fi
          python scripts/record_ci_identity.py \
            --tested-ref-type "${tested_ref_type}" \
            --tested-sha "$(git rev-parse HEAD)" \
            --tested-tree-sha "$(git rev-parse 'HEAD^{tree}')" \
            --reviewed-head-sha "${EXPECTED_SHA}" \
            --synthetic-merge false \
            --claim-exact-head "${claim_exact_head}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --job-id "${GITHUB_JOB}-${{ matrix.python-version }}" \
            --output ci-identity.json

      - name: Validate versioned repository
        run: python scripts/validate_repository_v2.py

      - name: Run focused Behavioral Rule Coverage mutations
        run: python -m pytest -q tests/test_behavioral_rule_coverage.py

      - name: Run focused governance enforcement tests
        run: python -m pytest -q tests/test_governance_enforcement.py

      - name: Diagnose closure version alignment
        id: closure_version
        continue-on-error: true
        run: python -m pytest -q tests/test_repository_closure.py -k active_version_declarations

      - name: Diagnose closure status statement
        id: closure_status
        continue-on-error: true
        run: python -m pytest -q tests/test_repository_closure.py -k current_status_statement

      - name: Diagnose closure lifecycle prose
        id: closure_lifecycle
        continue-on-error: true
        run: python -m pytest -q tests/test_repository_closure.py -k active_lifecycle_documents

      - name: Diagnose closure release locks
        id: closure_locks
        continue-on-error: true
        run: python -m pytest -q tests/test_repository_closure.py -k active_and_historical_release_locks

      - name: Diagnose closure residue
        id: closure_residue
        continue-on-error: true
        run: python -m pytest -q tests/test_repository_closure.py -k temporary_repair_or_encoded_payload

      - name: Diagnose closure workflow hygiene
        id: closure_workflows
        continue-on-error: true
        run: python -m pytest -q tests/test_repository_closure.py -k permanent_workflows

      - name: Require all closure diagnostics
        if: always()
        env:
          VERSION_OUTCOME: ${{ steps.closure_version.outcome }}
          STATUS_OUTCOME: ${{ steps.closure_status.outcome }}
          LIFECYCLE_OUTCOME: ${{ steps.closure_lifecycle.outcome }}
          LOCKS_OUTCOME: ${{ steps.closure_locks.outcome }}
          RESIDUE_OUTCOME: ${{ steps.closure_residue.outcome }}
          WORKFLOWS_OUTCOME: ${{ steps.closure_workflows.outcome }}
        run: |
          test "${VERSION_OUTCOME}" = success
          test "${STATUS_OUTCOME}" = success
          test "${LIFECYCLE_OUTCOME}" = success
          test "${LOCKS_OUTCOME}" = success
          test "${RESIDUE_OUTCOME}" = success
          test "${WORKFLOWS_OUTCOME}" = success

      - name: Run focused canonical output enforcement tests
        run: python -m pytest -q tests/test_canonical_output_enforcement.py

      - name: Run verified-byte accessor TOCTOU regressions
        run: python -m pytest -q tests/test_canonical_output_enforcement.py -k toctou

      - name: Run focused canonical output atomicity tests
        run: python -m pytest -q tests/test_canonical_output_atomicity.py

      - name: Run publication commit-point cleanup regression
        run: python -m pytest -q tests/test_canonical_output_atomicity.py -k partial_backup_cleanup_failure_after_commit

      - name: Run focused artifact byte-consistency tests
        run: python -m pytest -q tests/test_dual_audience_outputs.py -k "manifest or byte or crlf or bom or newline"

      - name: Run semantic and rendering tests
        run: python -m pytest
