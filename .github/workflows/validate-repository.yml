name: Validate PR Inspector repository

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Print first canonical-output failure
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir source
          git -C source init -q
          git -C source remote add origin https://github.com/rezahh107/PR-Inspector.git
          git -C source fetch -q --depth=1 origin "${EXPECTED_SHA}"
          git -C source checkout -q --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "${EXPECTED_SHA}"
          python3 -m venv source/.venv
          source/.venv/bin/python -m pip install -q --disable-pip-version-check "./source[dev]"
          source/.venv/bin/python -m pytest -q -x source/tests/test_canonical_output_enforcement.py
