name: Validate PR Inspector repository

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose-test-group:
    name: diagnose ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: a-b
            pattern: "tests/test_[a-b]*.py"
          - name: c-d
            pattern: "tests/test_[c-d]*.py"
          - name: e-f
            pattern: "tests/test_[e-f]*.py"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact triggering head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned project and test dependencies
        run: python -m pip install --disable-pip-version-check ".[dev]"
      - name: Run diagnostic test group
        shell: bash
        env:
          TEST_PATTERN: ${{ matrix.pattern }}
        run: |
          set -euo pipefail
          mapfile -t files < <(compgen -G "${TEST_PATTERN}" | sort)
          test "${#files[@]}" -gt 0
          python -m pytest -q "${files[@]}"
