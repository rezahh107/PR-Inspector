name: Validate PR Inspector repository

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Canonical validation commands retained for repository self-checks:
# python scripts/validate_repository_v2.py
# python -m pytest -q tests/test_behavioral_rule_coverage.py
# python -m pytest -q tests/test_coverage_trust_gate.py
# python -m pytest -q tests/test_governance_enforcement.py
# python -m pytest -q tests/test_personal_minimum_security_profile.py
# python -m pytest -q tests/test_repository_closure.py
# python -m pytest -q tests/test_canonical_output_enforcement.py
# python -m pytest -q tests/test_canonical_output_enforcement.py -k toctou
# python -m pytest -q tests/test_canonical_output_atomicity.py
# python -m pytest -q tests/test_canonical_output_atomicity.py -k partial_backup_cleanup_failure_after_commit
# python -m pytest -q tests/test_dual_audience_outputs.py -k "manifest or byte or crlf or bom or newline"
# python -m pytest

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Print first full-suite failure
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir source
          git -C source init -q
          git -C source remote add origin https://github.com/rezahh107/PR-Inspector.git
          git -C source fetch -q --depth=1 origin "${EXPECTED_SHA}"
          git -C source checkout -q --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "${EXPECTED_SHA}"
          python3 -m venv source/.venv
          source/.venv/bin/python -m pip install -q --disable-pip-version-check "./source[dev]"
          source/.venv/bin/python -m pytest -q -x source
