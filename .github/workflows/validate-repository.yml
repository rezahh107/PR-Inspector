name: Export exact main baseline

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-main:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository objects
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 60faae6a6f6ecf69f5ddfa3f7a2df8df374c15f2
          fetch-depth: 1
          persist-credentials: false

      - name: Package exact main
        run: git archive --format=tar --output=/tmp/pr-inspector-main.tar 60faae6a6f6ecf69f5ddfa3f7a2df8df374c15f2

      - name: Upload main baseline
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-inspector-main-baseline
          path: /tmp/pr-inspector-main.tar
          if-no-files-found: error
          retention-days: 1
