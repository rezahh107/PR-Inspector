name: Validate PR Inspector repository

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install pinned project and test dependencies
        run: python -m pip install --disable-pip-version-check ".[dev]"

      - name: Capture active canonical hashes for release-lock construction
        run: |
          python - <<'PY' | tee release-lock.txt
          import hashlib
          from pathlib import Path
          import yaml

          root = Path.cwd()
          manifest = yaml.safe_load((root / "protocol-manifest.yaml").read_text(encoding="utf-8"))
          for relative in manifest["load_order"]:
              digest = hashlib.sha256((root / relative).read_bytes()).hexdigest()
              print(f"{digest}  {relative}")
          PY

      - name: Validate versioned repository
        run: python scripts/validate_repository_v2.py

      - name: Run semantic and rendering tests
        id: test-suite
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest 2>&1 | tee pytest.log

      - name: Upload temporary validation diagnostics
        if: ${{ always() && matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-inspector-v1-8-diagnostics
          path: |
            release-lock.txt
            pytest.log
          if-no-files-found: error
          retention-days: 1

      - name: Enforce test outcome
        if: ${{ steps.test-suite.outcome != 'success' }}
        run: exit 1
