name: Validate PR Inspector repository

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact triggering head
        if: ${{ false }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact checkout identity
        if: ${{ false }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${EXPECTED_SHA}"

      - name: Record and validate tested object identity
        if: ${{ false }}
        run: |
          python scripts/record_ci_identity.py \
            --tested-ref-type pull_request_head \
            --tested-sha "$(git rev-parse HEAD)" \
            --tested-tree-sha "$(git rev-parse 'HEAD^{tree}')" \
            --reviewed-head-sha "${EXPECTED_SHA}" \
            --synthetic-merge false \
            --claim-exact-head true \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --job-id "${GITHUB_JOB}" \
            --output ci-identity.json

      - name: Validate versioned repository
        if: ${{ false }}
        run: python scripts/validate_repository_v2.py

      - name: Run focused Behavioral Rule Coverage mutations
        if: ${{ false }}
        run: python -m pytest -q tests/test_behavioral_rule_coverage.py

      - name: Run focused external Coverage trust gate tests
        if: ${{ false }}
        run: python -m pytest -q tests/test_coverage_trust_gate.py

      - name: Run focused governance enforcement tests
        if: ${{ false }}
        run: python -m pytest -q tests/test_governance_enforcement.py

      - name: Run personal minimum-security profile tests
        if: ${{ false }}
        run: python -m pytest -q tests/test_personal_minimum_security_profile.py

      - name: Run repository closure and hygiene checks
        if: ${{ false }}
        run: python -m pytest -q tests/test_repository_closure.py

      - name: Run focused canonical output enforcement tests
        if: ${{ false }}
        run: python -m pytest -q tests/test_canonical_output_enforcement.py

      - name: Run verified-byte accessor TOCTOU regressions
        if: ${{ false }}
        run: python -m pytest -q tests/test_canonical_output_enforcement.py -k toctou

      - name: Run focused canonical output atomicity tests
        if: ${{ false }}
        run: python -m pytest -q tests/test_canonical_output_atomicity.py

      - name: Run publication commit-point cleanup regression
        if: ${{ false }}
        run: python -m pytest -q tests/test_canonical_output_atomicity.py -k partial_backup_cleanup_failure_after_commit

      - name: Run focused artifact byte-consistency tests
        if: ${{ false }}
        run: python -m pytest -q tests/test_dual_audience_outputs.py -k "manifest or byte or crlf or bom or newline"

      - name: Run semantic and rendering tests
        if: ${{ false }}
        run: python -m pytest

      - name: Print first remaining full-suite failure
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir source
          git -C source init -q
          git -C source remote add origin https://github.com/rezahh107/PR-Inspector.git
          git -C source fetch -q --depth=1 origin "${EXPECTED_SHA}"
          git -C source checkout -q --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "${EXPECTED_SHA}"
          python3 -m venv source/.venv
          source/.venv/bin/python -m pip install -q --disable-pip-version-check "./source[dev]"
          source/.venv/bin/python -m pytest -q -x source
