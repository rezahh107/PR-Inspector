name: Validate PR Inspector repository

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose-test-letter:
    name: diagnose ${{ matrix.letter }}
    strategy:
      fail-fast: false
      matrix:
        letter: [a, b, c, d, e, f]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact triggering head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned project and test dependencies
        run: python -m pip install --disable-pip-version-check ".[dev]"
      - name: Run diagnostic test letter
        shell: bash
        env:
          TEST_PATTERN: tests/test_${{ matrix.letter }}*.py
        run: |
          set -euo pipefail
          mapfile -t files < <(compgen -G "${TEST_PATTERN}" | sort || true)
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "No matching tests; diagnostic letter passes."
            exit 0
          fi
          python -m pytest -q "${files[@]}"
