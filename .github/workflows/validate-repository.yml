name: Publish validated v1.9 artifact

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_ID: '8236207004'
      ARTIFACT_SHA256: 'ece5e202a5a642846bf368beec172ca7d27222d35a5d3c97873300f4a4b8dd1b'
      TARGET_BRANCH: agent/post-merge-governance-v1-9
      TRIGGER_HEAD: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact triggering head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download and verify validated snapshot
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/snapshot.zip
          echo "${ARTIFACT_SHA256}  /tmp/snapshot.zip" | sha256sum -c -
          mkdir -p /tmp/artifact /tmp/desired
          unzip -q /tmp/snapshot.zip -d /tmp/artifact
          tar -xzf /tmp/artifact/pr-inspector-v1.9.0.tar.gz -C /tmp/desired
          rm -rf /tmp/desired/build /tmp/desired/dist /tmp/desired/.pytest_cache
          find /tmp/desired -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Revalidate extracted snapshot
        working-directory: /tmp/desired
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ".[dev]"
          python scripts/validate_repository_v2.py
          python -m pytest -q tests/test_behavioral_rule_coverage.py
          python -m pytest -q tests/test_governance_enforcement.py
          python -m pytest

      - name: Create repository commit from validated files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          repo = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["TARGET_BRANCH"]
          expected_head = os.environ["TRIGGER_HEAD"]
          token = os.environ["GITHUB_TOKEN"]
          desired = Path("/tmp/desired")

          changed_paths = [
              "CHANGELOG.md",
              "CURRENT_VERSION",
              "README.md",
              "docs/GOVERNANCE_SETTINGS_PLAN.md",
              "fixtures/external-review-invalid-missing-evidence/review-package.json",
              "fixtures/external-review-invalid-unknown-finding/review-package.json",
              "fixtures/external-review-valid/review-package.json",
              "fixtures/golden-green/review-package.json",
              "fixtures/governance/mutation-cases.json",
              "fixtures/governance/verified-enforced.json",
              "fixtures/intent-fit-invalid-hypothesis-only/review-package.json",
              "fixtures/intent-fit-invalid-missing/review-package.json",
              "fixtures/intent-fit-valid-not-assessable/review-package.json",
              "fixtures/intent-fit-valid-satisfied/review-package.json",
              "fixtures/repair-handoff-valid/review-package.json",
              "fixtures/rereview-sequence/valid.json",
              "pr_inspector/__init__.py",
              "pr_inspector/decision_projection.py",
              "pr_inspector/governance.py",
              "pr_inspector/repository.py",
              "pr_inspector/sequence_policy.py",
              "protocol-manifest.yaml",
              "protocols/v1.9.0/PR_REVIEW_CONTRACT.md",
              "protocols/v1.9.0/pipeline/REVIEW_PIPELINE.md",
              "protocols/v1.9.0/policies/BEHAVIORAL_RULE_COVERAGE.md",
              "protocols/v1.9.0/policies/DECISION_GATES.md",
              "protocols/v1.9.0/policies/DERIVED_OUTPUTS.md",
              "protocols/v1.9.0/policies/GOVERNANCE_BEHAVIORAL_RULE_COVERAGE.md",
              "protocols/v1.9.0/policies/MERGE_GOVERNANCE.md",
              "protocols/v1.9.0/policies/OWNER_OUTPUT_UX.md",
              "protocols/v1.9.0/policies/SECURITY_AND_TRUST.md",
              "protocols/v1.9.0/prompts/INTAKE_RESPONSE.fa.md",
              "protocols/v1.9.0/registries/DECISION_REASON_REGISTRY.yaml",
              "protocols/v1.9.0/schemas/ci-identity.schema.json",
              "protocols/v1.9.0/schemas/decision-projection.schema.json",
              "protocols/v1.9.0/schemas/governance-evidence.schema.json",
              "protocols/v1.9.0/schemas/rereview-sequence.schema.json",
              "protocols/v1.9.0/schemas/review-package.schema.json",
              "protocols/v1.9.0/templates/OWNER_DECISION_CARD.fa.md",
              "protocols/v1.9.0/templates/TECHNICAL_HANDOFF.en.md",
              "protocols/v1.9.0/trust/INSPECTOR_TRUST_POLICY.json",
              "pyproject.toml",
              "release-locks/v1.9.0.sha256",
              "tests/test_behavioral_rule_coverage.py",
              "tests/test_dual_audience_outputs.py",
              "tests/test_governance_enforcement.py",
              "tests/test_rereview_orphan_acceptance.py",
          ]
          delete_paths = [
              "docs/GENERATOR_FAILURE.log",
              "scripts/generate_post_merge_polish.py",
              "scripts/run_patched_post_merge_polish.py",
          ]

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          def api(method: str, path: str, payload: dict | None = None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = Request(
                  f"https://api.github.com/repos/{repo}/{path}",
                  data=data,
                  method=method,
                  headers=headers,
              )
              try:
                  with urlopen(request) as response:
                      return json.load(response)
              except HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"GitHub API {method} {path} failed: {exc.code} {body}") from exc

          ref_path = f"git/ref/heads/{quote(branch, safe='/')}"
          current_ref = api("GET", ref_path)
          current_head = current_ref["object"]["sha"]
          if current_head != expected_head:
              raise SystemExit(f"branch moved: expected {expected_head}, observed {current_head}")

          commit = api("GET", f"git/commits/{current_head}")
          tree_entries = []
          for path in changed_paths:
              file_path = desired / path
              if not file_path.is_file():
                  raise SystemExit(f"validated snapshot missing {path}")
              blob = api(
                  "POST",
                  "git/blobs",
                  {
                      "content": base64.b64encode(file_path.read_bytes()).decode("ascii"),
                      "encoding": "base64",
                  },
              )
              mode = "100755" if os.access(file_path, os.X_OK) else "100644"
              tree_entries.append({"path": path, "mode": mode, "type": "blob", "sha": blob["sha"]})

          tree_entries.extend({"path": path, "mode": "100644", "type": "blob", "sha": None} for path in delete_paths)
          new_tree = api(
              "POST",
              "git/trees",
              {"base_tree": commit["tree"]["sha"], "tree": tree_entries},
          )
          new_commit = api(
              "POST",
              "git/commits",
              {
                  "message": "feat: add v1.9 governance enforcement",
                  "tree": new_tree["sha"],
                  "parents": [current_head],
              },
          )
          api(
              "PATCH",
              f"git/refs/heads/{quote(branch, safe='/')}",
              {"sha": new_commit["sha"], "force": False},
          )
          print(f"published_commit={new_commit['sha']}")
          PY
