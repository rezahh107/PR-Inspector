name: Export validated post-merge hardening

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-v1-9-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip

      - name: Generate, validate, and package
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check PyYAML==6.0.3
          python scripts/run_patched_post_merge_polish.py
          rm -rf build dist .pytest_cache
          rm -f scripts/generate_post_merge_polish.py scripts/run_patched_post_merge_polish.py docs/GENERATOR_FAILURE.log
          python -m pip install --disable-pip-version-check ".[dev]"
          python scripts/validate_repository_v2.py
          python -m pytest -q tests/test_behavioral_rule_coverage.py
          python -m pytest -q tests/test_governance_enforcement.py
          python -m pytest
          git show origin/main:.github/workflows/validate-repository.yml > .github/workflows/validate-repository.yml
          rm -f .github/workflows/post-merge-polish-generator.yml
          rm -rf build dist .pytest_cache
          tar --exclude=.git --exclude='*.egg-info' --exclude='__pycache__' -czf /tmp/pr-inspector-v1.9.0.tar.gz .
          git archive --format=tar.gz --output=/tmp/pr-inspector-main.tar.gz origin/main

      - name: Upload validated snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-inspector-v1.9.0-and-main
          path: |
            /tmp/pr-inspector-v1.9.0.tar.gz
            /tmp/pr-inspector-main.tar.gz
          if-no-files-found: error
          retention-days: 1
