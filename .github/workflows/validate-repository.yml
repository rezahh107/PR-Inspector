name: Publish validated post-merge hardening

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/post-merge-governance-v1-9
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip

      - name: Generate and validate
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check PyYAML==6.0.3
          python scripts/run_patched_post_merge_polish.py
          rm -rf build dist .pytest_cache
          rm -f scripts/generate_post_merge_polish.py scripts/run_patched_post_merge_polish.py docs/GENERATOR_FAILURE.log
          python -m pip install --disable-pip-version-check ".[dev]"
          python scripts/validate_repository_v2.py
          python -m pytest -q tests/test_behavioral_rule_coverage.py
          python -m pytest -q tests/test_governance_enforcement.py
          python -m pytest
          rm -rf build dist .pytest_cache
          find . -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Commit non-workflow snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git restore --staged .github/workflows/validate-repository.yml
          git restore --staged .github/workflows/post-merge-polish-generator.yml || true
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat: add v1.9 governance enforcement"
          git push origin HEAD:agent/post-merge-governance-v1-9
