name: Complete PR29 repair

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: complete-pr29-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.number == 29 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact triggering commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Verify exact checkout identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project validation dependencies
        run: python -m pip install --disable-pip-version-check ".[dev]"

      - name: Apply deterministic repair completion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          import yaml

          root = Path.cwd()

          def replace_once(path: str, old: str, new: str) -> None:
              target = root / path
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "README.md",
              "Repository code validates artifacts, provenance, identities, lifecycle sequences, and prompt semantic completeness. Human or specialist reviewers supply judgment. PR Inspector records evidence but never approves or merges.\n",
              "Repository code validates artifacts, provenance, identities, lifecycle sequences, and prompt semantic completeness. Human or specialist reviewers supply judgment. PR Inspector records evidence but never approves or merges.\n\nRepository authority is determined from live `main`. A completed integration must consume `VerifiedReviewCompletion` and return owner-facing output through `official_owner_delivery`; manual concatenation and reconstructed Candidate output are unsupported.\n",
          )
          replace_once("CHANGELOG.md", "PR #43 indepent verifier", "PR #43 independent verifier")
          replace_once("CHANGELOG.md", "canonical JSON review packae", "canonical JSON review package")

          coverage_path = root / "pr_inspector/behavioral_coverage.py"
          coverage = coverage_path.read_text(encoding="utf-8")
          marker = '    "PRR-GOV-PROJECTION-AUTHORITY-001",\n'
          addition = marker + '    "PRR-PROMPT-SEMANTIC-001",\n    "PRR-OUTPUT-AUTHORITY-001",\n'
          if coverage.count(marker) != 1:
              raise SystemExit("behavioral coverage insertion marker mismatch")
          coverage_path.write_text(coverage.replace(marker, addition, 1), encoding="utf-8")

          candidate_path = root / "pr_inspector/candidate_v1_11.py"
          candidate = candidate_path.read_text(encoding="utf-8")
          collapses = {
              "def render_candidate_next_action_prompt(\n    *args: Any, **kwargs: Any\n) -> bytes:":
                  "def render_candidate_next_action_prompt(*args: Any, **kwargs: Any) -> bytes:",
              "def build_candidate_review_artifacts(\n    *args: Any, **kwargs: Any\n) -> Mapping[str, bytes]:":
                  "def build_candidate_review_artifacts(*args: Any, **kwargs: Any) -> Mapping[str, bytes]:",
              "def verify_candidate_review_artifact_bytes(\n    *args: Any, **kwargs: Any\n) -> Any:":
                  "def verify_candidate_review_artifact_bytes(*args: Any, **kwargs: Any) -> Any:",
              "def verify_minimal_review_artifact_bytes(\n    *args: Any, **kwargs: Any\n) -> Any:":
                  "def verify_minimal_review_artifact_bytes(*args: Any, **kwargs: Any) -> Any:",
              "def build_candidate_owner_delivery_artifacts(\n    *args: Any, **kwargs: Any\n) -> Mapping[str, bytes]:":
                  "def build_candidate_owner_delivery_artifacts(*args: Any, **kwargs: Any) -> Mapping[str, bytes]:",
          }
          for old, new in collapses.items():
              if candidate.count(old) != 1:
                  raise SystemExit(f"candidate signature marker mismatch: {old.splitlines()[0]}")
              candidate = candidate.replace(old, new, 1)
          candidate_path.write_text(candidate, encoding="utf-8")

          replace_once(
              "protocols/v1.11.1/PR_REVIEW_CONTRACT.md",
              "There is exactly one projection authority, one prompt renderer, one artifact builder, one artifact verifier, and one prompt-required owner-delivery authority.",
              "There is one canonical projection authority, one prompt renderer, one artifact builder, one artifact verifier, and one prompt-required owner-delivery authority.",
          )
          replace_once(
              "protocols/v1.11.1/PR_REVIEW_CONTRACT.md",
              "`pr_inspector.candidate_v1_11` is a bounded compatibility module.",
              "`pr_inspector.candidate_v1_11` is a bounded pre-package compatibility module.",
          )
          replace_once(
              "protocols/v1.11.1/PR_REVIEW_CONTRACT.md",
              "External integrations MUST consume verified completion and official accessors. Candidate output accessors, direct artifact concatenation, manually reconstructed prompts, and model-authored substitutes are not supported. External execution evidence remains separate from repository-enforceable acceptance tests.\n\n## Version integrity",
              "External integrations MUST consume verified completion and official accessors. Candidate output accessors, direct artifact concatenation, manually reconstructed prompts, and model-authored substitutes are not supported. External execution evidence remains separate from repository-enforceable acceptance tests.\n\n## Historical review provenance\n\nPR #12 is historical provenance only. Its recorded review state `COMMENTED` did not prove completion, approval, or merge authorization. Historical comments cannot replace current exact-head validation or independent review.\n\n## Version integrity",
          )

          fixture_paths = (
              "fixtures/external-review-invalid-missing-evidence/review-package.json",
              "fixtures/external-review-invalid-unknown-finding/review-package.json",
              "fixtures/external-review-valid/review-package.json",
              "fixtures/golden-green/review-package.json",
              "fixtures/intent-fit-invalid-hypothesis-only/review-package.json",
              "fixtures/intent-fit-invalid-missing/review-package.json",
              "fixtures/intent-fit-valid-not-assessable/review-package.json",
              "fixtures/intent-fit-valid-satisfied/review-package.json",
              "fixtures/repair-handoff-valid/review-package.json",
              "fixtures/rereview-sequence/valid.json",
          )

          def update_protocol_versions(value: object) -> None:
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key == "protocol_version":
                          value[key] = "v1.11.1"
                      else:
                          update_protocol_versions(child)
              elif isinstance(value, list):
                  for child in value:
                      update_protocol_versions(child)

          for rel in fixture_paths:
              path = root / rel
              value = json.loads(path.read_text(encoding="utf-8"))
              update_protocol_versions(value)
              path.write_text(
                  json.dumps(
                      value,
                      ensure_ascii=False,
                      sort_keys=True,
                      separators=(",", ":"),
                  ) + "\n",
                  encoding="utf-8",
              )

          manifest = yaml.safe_load((root / "protocol-manifest.yaml").read_text(encoding="utf-8"))
          version = (root / "CURRENT_VERSION").read_text(encoding="utf-8").strip()
          if version != "v1.11.1" or manifest.get("active_version") != version:
              raise SystemExit("active version identity mismatch")
          lock_lines = []
          for rel in manifest["load_order"]:
              digest = hashlib.sha256((root / rel).read_bytes()).hexdigest()
              lock_lines.append(f"{digest}  {rel}")
          (root / f"release-locks/{version}.sha256").write_text(
              "\n".join(lock_lines) + "\n",
              encoding="utf-8",
          )
          PY
          rm .github/workflows/complete-pr29-repair.yml

      - name: Validate completed repair
        run: |
          set -euo pipefail
          python scripts/validate_repository_v2.py
          python -m pytest -q tests/test_behavioral_rule_coverage.py
          python -m pytest -q tests/test_repository_closure.py
          python -m pytest -q tests/test_v1_11_1_output_authority.py
          python -m pytest -q

      - name: Commit validated repair
        env:
          BRANCH: fix/v1-11-1-output-authority-consolidation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: complete v1.11.1 output authority consolidation"
          git push origin "HEAD:${BRANCH}"
