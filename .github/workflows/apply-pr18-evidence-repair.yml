name: Apply bounded PR18 evidence repair

on:
  push:
    branches:
      - governance/personal-minimum-security-profile

permissions:
  contents: write

concurrency:
  group: apply-pr18-evidence-repair
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'rezahh107/PR-Inspector' && github.ref == 'refs/heads/governance/personal-minimum-security-profile'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact staged head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify staged checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Reconstruct and verify bounded repair payload
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .pr18-repair/chunk00.b64 \
            .pr18-repair/chunk01.b64 \
            .pr18-repair/chunk02a.b64 \
            .pr18-repair/chunk02b.b64 \
            .pr18-repair/chunk02.b64 \
            .pr18-repair/chunk03.b64 \
            .pr18-repair/chunk04a.b64 \
            .pr18-repair/chunk04b.b64 \
            .pr18-repair/chunk04c.b64 \
            .pr18-repair/chunk04d.b64 \
            .pr18-repair/chunk05a.b64 \
            .pr18-repair/chunk05b.b64 \
            | base64 --decode > /tmp/pr18-repair.tgz
          echo '09186ead10ff455f2c036fe516199f14258a49ba051077b07cfa7ae549b10993  /tmp/pr18-repair.tgz' | sha256sum --check --strict
          cat > /tmp/expected-paths.txt <<'EOF'
          pr_inspector/decision_projection.py
          pr_inspector/derived_outputs.py
          pr_inspector/governance.py
          pr_inspector/repository.py
          pr_inspector/review_provenance.py
          pr_inspector/security_profile.py
          pr_inspector/semantic_v2.py
          pr_inspector/validation_v2.py
          protocols/v1.9.1/PR_REVIEW_CONTRACT.md
          protocols/v1.9.1/pipeline/REVIEW_PIPELINE.md
          protocols/v1.9.1/policies/DECISION_GATES.md
          protocols/v1.9.1/policies/GOVERNANCE_BEHAVIORAL_RULE_COVERAGE.md
          protocols/v1.9.1/policies/MERGE_GOVERNANCE.md
          protocols/v1.9.1/policies/PERSONAL_MINIMUM_SECURITY_PROFILE.md
          protocols/v1.9.1/registries/DECISION_REASON_REGISTRY.yaml
          protocols/v1.9.1/schemas/decision-projection.schema.json
          protocols/v1.9.1/schemas/review-package.schema.json
          tests/test_canonical_output_enforcement.py
          tests/test_personal_minimum_security_profile.py
          tests/test_repository_closure.py
          EOF
          sed -i 's/^          //' /tmp/expected-paths.txt
          tar -tzf /tmp/pr18-repair.tgz | sort > /tmp/actual-paths.txt
          sort /tmp/expected-paths.txt > /tmp/expected-paths.sorted.txt
          diff -u /tmp/expected-paths.sorted.txt /tmp/actual-paths.txt
          tar --no-same-owner -xzf /tmp/pr18-repair.tgz

      - name: Remove one-time transport files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pr18-repair
          rm -f .github/workflows/apply-pr18-evidence-repair.yml

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install --disable-pip-version-check '.[dev]'

      - name: Validate repository
        run: python scripts/validate_repository_v2.py

      - name: Validate personal minimum-security profile
        run: python -m pytest -q tests/test_personal_minimum_security_profile.py

      - name: Validate Behavioral Rule Coverage
        run: python -m pytest -q tests/test_behavioral_rule_coverage.py

      - name: Validate governance enforcement
        run: python -m pytest -q tests/test_governance_enforcement.py

      - name: Validate canonical output enforcement
        run: python -m pytest -q tests/test_canonical_output_enforcement.py

      - name: Validate repository closure
        run: python -m pytest -q tests/test_repository_closure.py

      - name: Run full test suite
        run: python -m pytest

      - name: Commit exact validated repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            pr_inspector/decision_projection.py \
            pr_inspector/derived_outputs.py \
            pr_inspector/governance.py \
            pr_inspector/repository.py \
            pr_inspector/review_provenance.py \
            pr_inspector/security_profile.py \
            pr_inspector/semantic_v2.py \
            pr_inspector/validation_v2.py \
            protocols/v1.9.1/PR_REVIEW_CONTRACT.md \
            protocols/v1.9.1/pipeline/REVIEW_PIPELINE.md \
            protocols/v1.9.1/policies/DECISION_GATES.md \
            protocols/v1.9.1/policies/GOVERNANCE_BEHAVIORAL_RULE_COVERAGE.md \
            protocols/v1.9.1/policies/MERGE_GOVERNANCE.md \
            protocols/v1.9.1/policies/PERSONAL_MINIMUM_SECURITY_PROFILE.md \
            protocols/v1.9.1/registries/DECISION_REASON_REGISTRY.yaml \
            protocols/v1.9.1/schemas/decision-projection.schema.json \
            protocols/v1.9.1/schemas/review-package.schema.json \
            tests/test_canonical_output_enforcement.py \
            tests/test_personal_minimum_security_profile.py \
            tests/test_repository_closure.py
          git add -A .pr18-repair .github/workflows/apply-pr18-evidence-repair.yml
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Enforce evidence-bound personal governance profile'
          git push origin HEAD:governance/personal-minimum-security-profile
