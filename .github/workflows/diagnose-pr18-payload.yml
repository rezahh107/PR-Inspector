name: Export untrusted PR18 payload for offline inspection

on:
  push:
    branches:
      - governance/personal-minimum-security-profile
  pull_request:
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: export-pr18-untrusted-payload-${{ github.sha }}
  cancel-in-progress: false

jobs:
  export:
    if: github.repository == 'rezahh107/PR-Inspector'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact untrusted head without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test -d .pr18-repair

      - name: Upload raw Base64 chunks without decoding or execution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr18-untrusted-raw-payload-${{ github.sha }}
          path: .pr18-repair/*.b64
          if-no-files-found: error
          retention-days: 1
