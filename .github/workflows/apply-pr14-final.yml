name: Apply verified PR14 final repair

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/canonical-artifact-enforcement'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_BASE_SHA: 549958fbb0e03ba363dfbf8a5bf9dfb86d08530d
      EXPECTED_ARCHIVE_SHA256: 041611b3005ff217e8bd4034edd6c68f8828048d71ff95d45af8ee0ad30ea54d
    steps:
      - name: Check out exact stacked head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 2

      - name: Verify parent identity and apply payload
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "${EVENT_BASE_SHA}" = "${EXPECTED_BASE_SHA}"
          cat .repair/pr14-final/chunk-*.b64 | base64 --decode > /tmp/pr14-final-patch.tar.xz
          echo "${EXPECTED_ARCHIVE_SHA256}  /tmp/pr14-final-patch.tar.xz" | sha256sum --check --strict
          tar -xJf /tmp/pr14-final-patch.tar.xz
          rm -f .github/workflows/export-current-snapshot.yml
          rm -f .github/workflows/apply-pr14-final.yml
          rm -rf .repair/pr14-final
          rmdir .repair 2>/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pinned project and test dependencies
        run: python -m pip install --disable-pip-version-check ".[dev]"

      - name: Validate final integrated tree
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_repository_v2.py
          python -m pytest -q tests/test_behavioral_rule_coverage.py
          python -m pytest -q tests/test_governance_enforcement.py
          python -m pytest -q tests/test_canonical_output_enforcement.py
          python -m pytest -q tests/test_canonical_output_atomicity.py
          python -m pytest -q tests/test_dual_audience_outputs.py -k "manifest or byte or crlf or bom or newline"
          python -m pytest

      - name: Commit exact validated repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: harden canonical rollback and integrate parent validation"
          git push origin HEAD:fix/canonical-artifact-enforcement
