name: Validate PR35 lifecycle reconciliation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact reconciliation Head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify bounded reconciliation delta
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --name-only --no-renames \
            be41cc8c4fad89a79f2b43b9dfa8a9dc42ee4684..HEAD \
            | sort > /tmp/actual-paths.txt
          cat > /tmp/expected-paths.txt <<'EOF'
          .github/pr35-reconciliation-tests.py
          .github/workflows/verify-pr35-post-merge.yml
          planning/NEXT_WORK.md
          planning/PR_INSPECTOR_EXECUTION_PLAN.md
          planning/progress/impacts/PINS-VERIFIED-REVIEW-001.implementation.json
          planning/tasks/task-registry.v1.json
          EOF
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt

      - name: Construct prospective main tree
        id: tree
        run: |
          set -euo pipefail
          python .github/pr35-reconciliation-tests.py
          git add tests/test_planning_governance.py tests/test_planning_governance_authority.py
          git rm --cached \
            .github/pr35-reconciliation-tests.py \
            .github/workflows/verify-pr35-post-merge.yml
          prospective_tree="$(git write-tree)"
          echo "tree=${prospective_tree}" >> "${GITHUB_OUTPUT}"
          printf '%s\n' "${prospective_tree}" > /tmp/prospective-main-tree.txt
          mkdir /tmp/prospective-main
          git archive "${prospective_tree}" | tar -x -C /tmp/prospective-main
          git reset --hard HEAD

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        working-directory: /tmp/prospective-main
        run: python -m pip install --disable-pip-version-check ".[dev]"

      - name: Validate prospective main repository and planning
        working-directory: /tmp/prospective-main
        run: |
          python scripts/validate_repository_v2.py
          python scripts/validate_planning_governance.py --check-static

      - name: Run focused planning tests
        working-directory: /tmp/prospective-main
        run: python -m pytest -q tests/test_planning_governance.py tests/test_planning_governance_authority.py

      - name: Run full repository suite
        working-directory: /tmp/prospective-main
        run: python -m pytest -q

      - name: Validate compilation and file bytes
        working-directory: /tmp/prospective-main
        run: |
          python -m compileall -q pr_inspector scripts
          sha256sum \
            planning/NEXT_WORK.md \
            planning/PR_INSPECTOR_EXECUTION_PLAN.md \
            planning/progress/impacts/PINS-VERIFIED-REVIEW-001.implementation.json \
            planning/tasks/task-registry.v1.json \
            tests/test_planning_governance.py \
            tests/test_planning_governance_authority.py \
            > /tmp/reconciliation-sha256.txt

      - name: Publish validated reconciliation commit
        id: publish
        env:
          PROSPECTIVE_TREE: ${{ steps.tree.outputs.tree }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          final_commit="$(printf '%s\n' 'chore: reconcile PR35 post-merge lifecycle' | git commit-tree "${PROSPECTIVE_TREE}" -p be41cc8c4fad89a79f2b43b9dfa8a9dc42ee4684)"
          printf '%s\n' "${final_commit}" > /tmp/reconciliation-commit.txt
          echo "commit=${final_commit}" >> "${GITHUB_OUTPUT}"
          git push origin "${final_commit}:refs/heads/agent/pr35-lifecycle-reconciliation-final"

      - name: Upload reconciliation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr35-lifecycle-reconciliation-${{ github.run_id }}
          path: |
            /tmp/prospective-main-tree.txt
            /tmp/reconciliation-commit.txt
            /tmp/reconciliation-sha256.txt
          if-no-files-found: error
          retention-days: 7
