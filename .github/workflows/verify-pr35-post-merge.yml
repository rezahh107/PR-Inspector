name: Verify PR35 post-merge main

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-pr35-main:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact PR35 merge commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: be41cc8c4fad89a79f2b43b9dfa8a9dc42ee4684
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact main identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "be41cc8c4fad89a79f2b43b9dfa8a9dc42ee4684"
          test "$(cat CURRENT_VERSION)" = "v1.12.0"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
          cache: pip

      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check ".[dev]"

      - name: Validate repository and planning
        run: |
          python scripts/validate_repository_v2.py
          python scripts/validate_planning_governance.py --check-static

      - name: Run focused lifecycle and authority suites
        run: |
          python -m pytest -q tests/test_planning_governance.py tests/test_planning_governance_authority.py
          python -m pytest -q tests/test_v1_12_verified_review_authority.py tests/test_v1_12_evidence_completeness.py
          python -m pytest -q tests/test_repository_closure.py

      - name: Run complete repository suite
        run: python -m pytest -q

      - name: Validate compilation and clean exact tree
        run: |
          python -m compileall -q pr_inspector scripts
          git diff --check
          test -z "$(git status --porcelain)"
          printf '%s\n' "$(git rev-parse HEAD)" > /tmp/validated-main-sha.txt
          printf '%s\n' "$(git rev-parse 'HEAD^{tree}')" > /tmp/validated-main-tree.txt

      - name: Upload exact-main evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr35-post-merge-main-${{ github.run_id }}
          path: |
            /tmp/validated-main-sha.txt
            /tmp/validated-main-tree.txt
          if-no-files-found: error
          retention-days: 7
