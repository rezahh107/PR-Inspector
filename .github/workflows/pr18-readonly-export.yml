name: PR18 read-only repository export

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  export:
    # Temporary read-only tooling; removed before the final repaired head.
    if: github.repository == 'rezahh107/PR-Inspector' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'governance/personal-minimum-security-profile'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checkout identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Create transparent source snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf /tmp/pr-inspector-source.tar.gz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr18-readonly-source-${{ github.event.pull_request.head.sha }}
          path: /tmp/pr-inspector-source.tar.gz
          if-no-files-found: error
          retention-days: 1
