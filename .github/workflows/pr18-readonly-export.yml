name: PR18 read-only repository export

on:
  push:
    branches:
      - governance/personal-minimum-security-profile

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checkout identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Create transparent source snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=pr-inspector-source.tar.gz -czf pr-inspector-source.tar.gz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr18-readonly-source-${{ github.sha }}
          path: pr-inspector-source.tar.gz
          if-no-files-found: error
          retention-days: 1
