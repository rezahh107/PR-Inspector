name: Export PR21 rerepair workspace

on:
  pull_request:

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.number == 35
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact triggering head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact checkout identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Create workspace archive
        run: tar --exclude=.git -czf /tmp/pr35-v1-12-workspace.tgz .

      - name: Upload workspace archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr35-v1-12-workspace-${{ github.run_id }}
          path: /tmp/pr35-v1-12-workspace.tgz
          if-no-files-found: error
          retention-days: 1
