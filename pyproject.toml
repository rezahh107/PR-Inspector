[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-inspector-protocol"
version = "1.10.0"
description = "Deterministic evidence-based pull-request review protocol and validators"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "jsonschema==4.26.0",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["pr_inspector*"]
exclude = ["fixtures*", "examples*", "protocols*", "references*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
