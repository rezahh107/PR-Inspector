schema_version: 2
protocol_name: PR Inspector
active_version: v1.10.2
status: active
entrypoint: BOOTSTRAP.md
minimum_python: '3.10'
default_owner_language: fa
default_technical_language: en
operation_mode: read_only_review
canonical_contract: protocols/v1.10.2/PR_REVIEW_CONTRACT.md
canonical_schema: protocols/v1.10.2/schemas/review-package.schema.json
release_lock: release-locks/v1.10.2.sha256
load_order:
- protocols/v1.10.2/PR_REVIEW_CONTRACT.md
- protocols/v1.10.2/policies/SECURITY_AND_TRUST.md
- protocols/v1.10.2/policies/EXTERNAL_COVERAGE_TRUST.md
- protocols/v1.10.2/trust/INSPECTOR_TRUST_POLICY.json
- protocols/v1.10.2/policies/DECISION_GATES.md
- protocols/v1.10.2/registries/DECISION_REASON_REGISTRY.yaml
- protocols/v1.10.2/policies/OWNER_OUTPUT_UX.md
- protocols/v1.10.2/policies/OWNER_DELIVERY_CONTRACT.json
- protocols/v1.10.2/policies/DERIVED_OUTPUTS.md
- protocols/v1.10.2/policies/BEHAVIORAL_RULE_COVERAGE.md
- protocols/v1.10.2/policies/CANONICAL_OUTPUT_BEHAVIORAL_RULE_COVERAGE.md
- protocols/v1.10.2/policies/MERGE_GOVERNANCE.md
- protocols/v1.10.2/policies/PERSONAL_MINIMUM_SECURITY_PROFILE.md
- protocols/v1.10.2/policies/GOVERNANCE_BEHAVIORAL_RULE_COVERAGE.md
- protocols/v1.10.2/pipeline/REVIEW_PIPELINE.md
- protocols/v1.10.2/templates/OWNER_DECISION_CARD.fa.md
- protocols/v1.10.2/templates/TECHNICAL_HANDOFF.en.md
- protocols/v1.10.2/schemas/review-package.schema.json
- protocols/v1.10.2/schemas/decision-projection.schema.json
- protocols/v1.10.2/schemas/owner-delivery-contract.schema.json
- protocols/v1.10.2/schemas/ci-identity.schema.json
- protocols/v1.10.2/schemas/rereview-sequence.schema.json
- protocols/v1.10.2/schemas/governance-evidence.schema.json
- protocols/v1.10.2/prompts/INTAKE_RESPONSE.fa.md
required_artifacts:
- review-package.json
- DECISION_PROJECTION.json
- OWNER_DECISION_CARD.fa.md
- TECHNICAL_HANDOFF.en.md
- OWNER_RESULT.fa.txt
- artifact-manifest.json
conditional_artifacts:
  NEXT_ACTION_PROMPT.en.md:
    source: DECISION_PROJECTION.json#/next_action
    required_when: prompt_required == true
    forbidden_when: prompt_required == false
forbidden_default_actions:
- modify_target_repository
- create_comment
- approve_pull_request
- merge_pull_request
- deploy
- access_sensitive_credentials
- access_production
validation_commands:
  repository: python scripts/validate_repository_v2.py
  review: python scripts/validate_review_v2.py REVIEW_DIRECTORY
  render: >-
    python scripts/render_review_v2.py REVIEW_DIRECTORY/review-package.json
    --output-dir REVIEW_DIRECTORY
    --target-repository OWNER/REPOSITORY
    --pr-number PR_NUMBER
  rereview_sequence: >-
    python scripts/validate_rereview_sequence.py SEQUENCE.json
    --review EVENT_ID=REVIEW_DIRECTORY
  behavioral_coverage: python -m pytest -q tests/test_behavioral_rule_coverage.py
  external_coverage_trust: python -m pytest -q tests/test_coverage_trust_gate.py
  canonical_output_enforcement: python -m pytest -q tests/test_canonical_output_enforcement.py
  canonical_output_atomicity: python -m pytest -q tests/test_canonical_output_atomicity.py
  atomic_owner_delivery: python -m pytest -q tests/test_atomic_owner_delivery.py
  atomic_owner_delivery_cli: python -m pytest -q tests/test_render_cli_owner_delivery.py
  publication_commit_point: >-
    python -m pytest -q tests/test_canonical_output_atomicity.py
    -k partial_backup_cleanup_failure_after_commit
  verified_byte_snapshot: >-
    python -m pytest -q tests/test_canonical_output_enforcement.py
    -k toctou
  governance: python -m pytest -q tests/test_governance_enforcement.py
  personal_minimum_security_profile: python -m pytest -q tests/test_personal_minimum_security_profile.py
  repository_closure: python -m pytest -q tests/test_repository_closure.py
  full_suite: python -m pytest
