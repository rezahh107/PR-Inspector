schema_version: 2
protocol_name: PR Inspector
active_version: v1.11.1
status: active
entrypoint: BOOTSTRAP.md
minimum_python: '3.10'
default_owner_language: fa
default_technical_language: en
operation_mode: read_only_review
canonical_contract: protocols/v1.11.1/PR_REVIEW_CONTRACT.md
canonical_schema: protocols/v1.11.1/schemas/review-package.schema.json
release_lock: release-locks/v1.11.1.sha256
load_order:
- protocols/v1.11.1/PR_REVIEW_CONTRACT.md
