schema_version: 2
protocol_name: PR Inspector
active_version: v1.8.0
status: active
entrypoint: BOOTSTRAP.md
minimum_python: "3.10"
default_owner_language: fa
default_technical_language: en
operation_mode: read_only_review
canonical_contract: protocols/v1.8.0/PR_REVIEW_CONTRACT.md
canonical_schema: protocols/v1.8.0/schemas/review-package.schema.json
release_lock: release-locks/v1.8.0.sha256

load_order:
  - protocols/v1.8.0/PR_REVIEW_CONTRACT.md
  - protocols/v1.8.0/policies/SECURITY_AND_TRUST.md
  - protocols/v1.8.0/trust/INSPECTOR_TRUST_POLICY.json
  - protocols/v1.8.0/policies/DECISION_GATES.md
  - protocols/v1.8.0/registries/DECISION_REASON_REGISTRY.yaml
  - protocols/v1.8.0/policies/OWNER_OUTPUT_UX.md
  - protocols/v1.8.0/policies/DERIVED_OUTPUTS.md
  - protocols/v1.8.0/policies/BEHAVIORAL_RULE_COVERAGE.md
  - protocols/v1.8.0/pipeline/REVIEW_PIPELINE.md
  - protocols/v1.8.0/templates/OWNER_DECISION_CARD.fa.md
  - protocols/v1.8.0/templates/TECHNICAL_HANDOFF.en.md
  - protocols/v1.8.0/schemas/review-package.schema.json
  - protocols/v1.8.0/schemas/decision-projection.schema.json
  - protocols/v1.8.0/schemas/ci-identity.schema.json
  - protocols/v1.8.0/schemas/rereview-sequence.schema.json
  - protocols/v1.8.0/prompts/INTAKE_RESPONSE.fa.md

required_artifacts:
  - review-package.json
  - DECISION_PROJECTION.json
  - OWNER_DECISION_CARD.fa.md
  - TECHNICAL_HANDOFF.en.md
  - OWNER_RESULT.fa.txt
  - artifact-manifest.json

conditional_artifacts:
  NEXT_ACTION_PROMPT.en.md:
    source: DECISION_PROJECTION.json#/next_action
    required_when: prompt_required == true
    forbidden_when: prompt_required == false

forbidden_default_actions:
  - modify_target_repository
  - create_comment
  - approve_pull_request
  - merge_pull_request
  - deploy
  - access_sensitive_credentials
  - access_production

validation_commands:
  repository: python scripts/validate_repository_v2.py
  review: python scripts/validate_review_v2.py REVIEW_DIRECTORY
  render: python scripts/render_review_v2.py REVIEW_DIRECTORY/review-package.json --output-dir REVIEW_DIRECTORY
  rereview_sequence: python scripts/validate_rereview_sequence.py SEQUENCE.json --review EVENT_ID=REVIEW_DIRECTORY
  behavioral_coverage: python -m pytest -q tests/test_behavioral_rule_coverage.py
  full_suite: python -m pytest
