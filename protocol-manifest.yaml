- protocols/v1.11.1/pipeline/REVIEW_PIPELINE.md
- protocols/v1.11.1/templates/OWNER_DECISION_CARD.fa.md
- protocols/v1.11.1/templates/TECHNICAL_HANDOFF.en.md
- protocols/v1.11.1/schemas/review-package.schema.json
- protocols/v1.11.1/schemas/decision-projection.schema.json
- protocols/v1.11.1/schemas/owner-delivery-contract.schema.json
- protocols/v1.11.1/schemas/ci-identity.schema.json
- protocols/v1.11.1/schemas/rereview-sequence.schema.json
- protocols/v1.11.1/schemas/governance-evidence.schema.json
- protocols/v1.11.1/prompts/INTAKE_RESPONSE.fa.md
required_artifacts:
- review-package.json
- DECISION_PROJECTION.json
- OWNER_DECISION_CARD.fa.md
- TECHNICAL_HANDOFF.en.md
- OWNER_RESULT.fa.txt
- artifact-manifest.json
- OWNER_PROFILE_COMMANDS.fa.txt
conditional_artifacts:
  NEXT_ACTION_PROMPT.en.md:
    source: DECISION_PROJECTION.json#/next_action
    generated_when: prompt_required=true
validation_commands:
- python scripts/validate_repository_v2.py
- python -m pytest -q tests/test_behavioral_rule_coverage.py
- python -m pytest -q tests/test_coverage_trust_gate.py
- python -m pytest -q tests/test_governance_enforcement.py
- python -m pytest -q tests/test_personal_minimum_security_profile.py
- python -m pytest -q tests/test_repository_closure.py
- python -m pytest -q tests/test_canonical_output_enforcement.py
- python -m pytest -q tests/test_canonical_output_atomicity.py
- python -m pytest -q tests/test_v1_11_1_output_authority.py
- python -m pytest -q
